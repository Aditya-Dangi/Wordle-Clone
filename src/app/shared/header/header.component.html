<header class="app-header" [class.scrolled]="scrolled()">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <span class="brand-tile">W</span>
      </span>
      <h1>Wordle</h1>
    </div>

    <nav class="main-nav" #navList aria-label="Main navigation">
      <span
        class="nav-indicator"
        [class.ready]="indicator().ready"
        [style.transform]="'translateX(' + indicator().x + 'px)'"
        [style.width.px]="indicator().w"
        aria-hidden="true"
      ></span>
      @for (item of navItems; track item.path; let i = $index) {
        <a #navLink class="nav-btn" [routerLink]="item.path" [class.active]="activeIndex() === i">{{ item.label }}</a>
      }
    </nav>

    <div class="header-actions">
      <div class="hud-chip streak-chip" title="Current win streak">
        <span class="hud-chip-icon">🔥</span>
        <span class="hud-chip-value">{{ streaks().current }}</span>
      </div>
      <div class="hud-chip level-chip" title="Player level and XP">
        <span class="hud-chip-value">LV {{ profile().level }}</span>
        <span class="xp-bar"><span class="xp-fill" [style.width.%]="xpPercent()"></span></span>
      </div>
      <div class="hud-chip coins-chip" title="Coins">
        <span class="hud-chip-icon">💎</span>
        <span class="hud-chip-value">{{ profile().coins }}</span>
      </div>
      <button class="icon-btn" type="button" aria-label="How to play" (click)="openHowto()">?</button>
    </div>
  </div>
</header>
