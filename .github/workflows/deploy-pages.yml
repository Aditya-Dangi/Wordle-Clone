name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href=/Wordle-Clone/
      # GitHub Pages has no server-side rewrites, so a direct/refresh visit to a
      # deep link (e.g. /Wordle-Clone/stats) 404s. Serving index.html as the 404
      # page keeps the requested URL intact and lets Angular's router take over
      # client-side - the same trick netlify.toml's SPA redirect does for Netlify.
      - run: cp dist/wordle-ng/browser/index.html dist/wordle-ng/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wordle-ng/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
